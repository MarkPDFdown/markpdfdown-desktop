name: Build and Upload Release Assets

on:
  release:
    types: [prereleased, released]

permissions:
  contents: write

jobs:
  build:
    # Only build assets on prereleased to avoid duplicate builds
    if: github.event.action == 'prereleased'
    strategy:
      # Let the other arches finish, so one run shows every failure. The run still concludes as
      # failed, and upload-manifests only promotes from a successful one.
      fail-fast: false
      matrix:
        # Each arch builds on its own native runner: npm and Prisma only install the prebuilt
        # binaries of the host arch, and electron-builder doesn't fetch those of another arch.
        # There is no Windows arm64 entry because Prisma has no Windows arm64 engine.
        include:
          - os: macos-15-intel
            platform: mac
            arch: x64
            manifest: latest-mac.yml
          - os: macos-latest
            platform: mac
            arch: arm64
            manifest: latest-mac.yml
          - os: windows-latest
            platform: win
            arch: x64
            manifest: latest.yml
          - os: ubuntu-latest
            platform: linux
            arch: x64
            manifest: latest-linux.yml
          - os: ubuntu-24.04-arm
            platform: linux
            arch: arm64
            manifest: latest-linux-arm64.yml

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      # phantomjs-prebuilt (via electron-icon-builder, dev-only) fails to install on linux-arm64.
      # Nothing in the build needs an install script: Prisma and electron-builder fetch on demand.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Set version from tag
        shell: bash
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          npm pkg set version=$VERSION
          echo "Set version to $VERSION"

      # Uploading is left to the steps below, so nothing is published before it's verified.
      - name: Build application
        run: npm run build:${{ matrix.platform }} -- --${{ matrix.arch }} --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.APPLE_CERTIFICATE }}
          CSC_KEY_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Install Electron runtime libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-0t64 libnss3 libgbm1 libasound2t64

      - name: Verify packaged native modules
        run: npm run verify:package -- --platform ${{ matrix.platform }} --arch ${{ matrix.arch }}

      - name: Submit notarization (async)
        if: matrix.platform == 'mac'
        continue-on-error: true
        run: |
          for dmg in release/*.dmg; do
            echo "Submitting $dmg for notarization..."
            xcrun notarytool submit "$dmg" \
              --apple-id "$APPLE_ID" \
              --password "$APPLE_APP_SPECIFIC_PASSWORD" \
              --team-id "$APPLE_TEAM_ID"
          done
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      # The exact file rather than a glob, which other yml files in release/ would satisfy. A missing
      # manifest fails the run here, before any asset is published, not at promotion to stable.
      - name: Save update manifest as artifact
        uses: actions/upload-artifact@v4
        with:
          name: update-manifests-${{ matrix.platform }}-${{ matrix.arch }}
          path: release/${{ matrix.manifest }}
          if-no-files-found: error
          retention-days: 30

      - name: Upload release assets (installers only)
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/*.AppImage
            release/*.deb
            release/*.rpm
            release/*.blockmap
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Upload auto-update manifests only when release is promoted to stable
  upload-manifests:
    if: github.event.action == 'released'
    runs-on: ubuntu-latest
    steps:
      - name: Download manifests from prereleased workflow run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          echo "Looking for prereleased workflow run for tag: $TAG"

          # Find the successful workflow run that built assets for this release tag
          RUN_ID=$(gh run list \
            --repo "${{ github.repository }}" \
            --workflow "release.yml" \
            --json databaseId,conclusion,headBranch \
            --jq ".[] | select(.headBranch == \"$TAG\" and .conclusion == \"success\") | .databaseId" \
            | head -n 1)

          if [ -z "$RUN_ID" ]; then
            echo "::error::No successful prereleased workflow run found for tag $TAG"
            exit 1
          fi

          echo "Found workflow run: $RUN_ID"

          # Download all update-manifests artifacts from that run
          gh run download "$RUN_ID" \
            --repo "${{ github.repository }}" \
            --pattern "update-manifests-*" \
            --dir manifests

          echo "Downloaded manifests:"
          find manifests -type f -name "*.yml" | sort

      # electron-updater reads one latest-mac.yml and picks the file for its arch from it.
      - name: Merge macOS manifests
        run: |
          MERGED=manifests/update-manifests-mac/latest-mac.yml
          mkdir -p "$(dirname "$MERGED")"
          yq '.files += load("manifests/update-manifests-mac-arm64/latest-mac.yml").files' \
            manifests/update-manifests-mac-x64/latest-mac.yml > "$MERGED"
          rm -r manifests/update-manifests-mac-x64 manifests/update-manifests-mac-arm64

          for arch in x64 arm64; do
            if ! grep -q -- "-$arch.zip" "$MERGED"; then
              echo "::error::$MERGED has no $arch zip"
              exit 1
            fi
          done

      - name: Validate required manifests
        run: |
          REQUIRED=(
            manifests/update-manifests-win-x64/latest.yml
            manifests/update-manifests-mac/latest-mac.yml
            manifests/update-manifests-linux-x64/latest-linux.yml
            manifests/update-manifests-linux-arm64/latest-linux-arm64.yml
          )
          for file in "${REQUIRED[@]}"; do
            if [ ! -f "$file" ]; then
              echo "::error::Missing required update manifest: $file"
              exit 1
            fi
          done

      - name: Upload update manifests to release
        uses: softprops/action-gh-release@v2
        with:
          files: manifests/**/*.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-npm:
    if: github.event.action == 'released'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: npm ci

      - name: Set version from tag
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          npm pkg set version=$VERSION
          echo "Set version to $VERSION"

      - name: Build
        run: npm run build

      - name: Add electron to optionalDependencies for npm publish
        run: |
          # Get electron version from devDependencies
          ELECTRON_VERSION=$(node -p "require('./package.json').devDependencies.electron")
          echo "Adding electron@$ELECTRON_VERSION to optionalDependencies"
          # Add electron to optionalDependencies using npm pkg
          npm pkg set optionalDependencies.electron="$ELECTRON_VERSION"
          # Remove electron from devDependencies to avoid duplication
          npm pkg delete devDependencies.electron
          echo "Updated package.json for npm publish"

      - name: Publish to npm
        run: npm publish --access public --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
